name: CRM S001 Exact Baseline

on:
  push:
    branches:
      - KIRCH-INTERLAN-CRM-S001-BASELINE-VALIDATION

permissions:
  contents: read

jobs:
  exact-baseline:
    name: Exact source / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repaired source
        uses: actions/checkout@v4
        with:
          ref: 1f0eeda99625549400ec4f06e39650301ac1ae4b
          fetch-depth: 1

      - name: Assert exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="1f0eeda99625549400ec4f06e39650301ac1ae4b"
          printf 'Expected: %s\nActual:   %s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InterLan.sln

      - name: Release build
        run: dotnet build InterLan.sln --configuration Release --no-restore

      - name: Aggregate SuiteChecks
        run: dotnet run --project tools/InterLan.SuiteChecks/InterLan.SuiteChecks.csproj --configuration Release --no-build
